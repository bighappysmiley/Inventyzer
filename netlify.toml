[build]
  publish = "."

# This app loads app.js as an in-browser-Babel script (type="text/babel").
# Netlify's automatic JS post-processing detects files by extension and will
# try to minify/bundle app.js as plain JavaScript, which breaks on the JSX
# syntax inside it. Disable post-processing so the file is served as-is.
[build.processing]
  skip_processing = true

# inventyzer.com is being retired in favor of im.bhswebsite.org — anyone
# still landing on the old domain gets a "we've moved" notice instead of
# the app. Host-scoped rules must come before the catch-all SPA rule below,
# since Netlify uses the first matching redirect.
[[redirects]]
  from = "https://inventyzer.com/*"
  to = "/moving.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.inventyzer.com/*"
  to = "/moving.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never let the browser/CDN cache a stale index.html (or the moving notice)
# across deploys — this is a single-page app and the HTML is the entry
# point that must always reflect the latest deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/moving.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
