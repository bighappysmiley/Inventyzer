<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="6;url=https://im.bhswebsite.org/" />
<title>Inventyzer has moved</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f04912'/%3E%3Ctext x='32' y='44' font-family='Arial, sans-serif' font-weight='600' font-size='36' fill='%23ffd59e' text-anchor='middle'%3Ei%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #f04912;
    --bg: #0d0f14;
    --card: #1a1d27;
    --border: #252838;
    --text: #e8eaf0;
    --muted: #8a93b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .logo-chip {
    display: inline-flex;
    align-items: center;
    background: var(--accent);
    border-radius: 8px;
    padding: 5px 12px;
    margin-bottom: 28px;
  }
  .logo-chip img { height: 24px; display: block; }
  h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0 0 28px;
  }
  .new-url {
    color: var(--text);
    font-weight: 600;
  }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    padding: 12px 26px;
    border-radius: 10px;
  }
  .btn:hover { opacity: 0.9; }
  .hint {
    margin-top: 22px;
    font-size: 0.78rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo-chip"><img src="./logo.svg" alt="Inventyzer" /></div>
  <h1>We've moved!</h1>
  <p>
    Inventyzer is now at <span class="new-url">im.bhswebsite.org</span>.
    Please update your bookmarks — this address will stop working soon.
  </p>
  <a class="btn" href="https://im.bhswebsite.org/">Take me there</a>
  <div class="hint">Redirecting automatically in a few seconds…</div>
</div>
<script>
  setTimeout(function () {
    window.location.href = "https://im.bhswebsite.org/";
  }, 6000);
</script>
</body>
</html>
